# Backends et tunnels de PRODUCTION. Les digests viennent de staging après validation en staging (PR qui recopie le digest de staging), jamais directement.
# Argo CD surveille le dossier `path` de ce depot, mais la PRODUCTION se deploie sur
# validation humaine : apres la fusion, l'application passe OutOfSync et attend un clic sur
# « Sync » (ou `argocd app sync`). Un git revert se deploie de la meme facon.
# Seul le premier deploiement est declenche par scripts/bootstrap-node.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cyberlab-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # repoURL et targetRevision sont reecrits au bootstrap (variables Terraform repo_url / repo_ref).
    repoURL: https://github.com/NAS-HomeServer/cyberlab-aws.git
    targetRevision: main
    path: k8s/cyberlab/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: cyberlab-production
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

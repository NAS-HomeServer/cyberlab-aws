# AWS : l'agent pousse ses metriques au Prometheus du NAS par son adresse Tailscale (reseau
# prive chiffre WireGuard, aucun port public). Le recepteur doit etre active sur le NAS :
# --web.enable-remote-write-receiver (voir docs/changements-nas-monitoring.md).
global:
  scrape_interval: 60s
  scrape_timeout: 15s
  external_labels:
    cluster: aws-k3s
scrape_config_files:
  - /etc/prometheus/scrape/scrape.yml
remote_write:
  - url: http://100.104.202.81:9090/api/v1/write
    queue_config:
      capacity: 2500
      max_shards: 2
      max_samples_per_send: 500

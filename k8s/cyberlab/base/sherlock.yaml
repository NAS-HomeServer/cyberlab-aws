apiVersion: apps/v1
kind: Deployment
metadata:
  name: sherlock
  annotations:
    # Exceptions Checkov (analyse de securite de la CI), limitees a cette ressource.
    checkov.io/skip1: "CKV_K8S_40=UID 1000 conserve, runAsNonRoot impose"
  labels:
    app.kubernetes.io/name: sherlock
    app.kubernetes.io/part-of: cyberlab
    app.kubernetes.io/component: backend
spec:
  # Aucun job a suivre : chaque scan est renvoye en flux sur la requete qui le lance
  # (aucune donnee durable). 2 replicas en production (overlay).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sherlock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sherlock
        app.kubernetes.io/part-of: cyberlab
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sherlock
          image: ghcr.io/ag69075/cyberlab_sherlock_backend
          ports:
            - name: http
              containerPort: 7100
          env:
            - name: ALLOWED_ORIGINS
              value: https://aginepro.work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1024Mi
          # Equivalent du HEALTHCHECK Dockerfile (toutes les 30 s, start-period 15 s).
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Equivalent de tmpfs /tmp:rw,noexec,nosuid,size=64m (compte dans la limite memoire).
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sherlock
  labels:
    app.kubernetes.io/name: sherlock
    app.kubernetes.io/part-of: cyberlab
spec:
  selector:
    app.kubernetes.io/name: sherlock
  ports:
    - name: http
      port: 7100
      targetPort: http

# Tests unitaires des regles (promtool test rules) : series synthetiques, alertes attendues.
rule_files:
  - cyberlab-aws.rules.yml
evaluation_interval: 1m

tests:
  # Staging : sherlock tombe a 0 replica a la minute 3 ; "for: 5m" => alerte (warning) a partir de la minute 8.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{cluster="aws-k3s", namespace="cyberlab-staging", env="staging", deployment="sherlock"}'
        values: "1 1 1 0x20"
      - series: 'kube_deployment_status_replicas_available{cluster="aws-k3s", namespace="cyberlab-staging", env="staging", deployment="dns-analyzer"}'
        values: "1x23"
    alert_rule_test:
      - eval_time: 6m
        alertname: AwsStagingWorkloadDown
        exp_alerts: []
      - eval_time: 10m
        alertname: AwsStagingWorkloadDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: cyberlab
              cluster: aws-k3s
              namespace: cyberlab-staging
              env: staging
              deployment: sherlock
            exp_annotations:
              summary: "AWS staging : sherlock indisponible"
              description: "Plus aucun replica disponible pour sherlock (namespace cyberlab-staging) depuis 5 minutes."

  # Production : "for: 2m" => alerte critique ; l'alerte staging ne se declenche pas pour un autre namespace.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{cluster="aws-k3s", namespace="cyberlab-production", env="production", deployment="audit-orchestrator"}'
        values: "1 0x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: AwsProductionWorkloadDown
        exp_alerts:
          - exp_labels:
              severity: critical
              service: cyberlab
              cluster: aws-k3s
              namespace: cyberlab-production
              env: production
              deployment: audit-orchestrator
            exp_annotations:
              summary: "AWS production : audit-orchestrator indisponible"
              description: "Plus aucun replica disponible pour audit-orchestrator (namespace cyberlab-production) depuis 2 minutes."
      - eval_time: 5m
        alertname: AwsStagingWorkloadDown
        exp_alerts: []

  # Isolation : les series d'un autre cluster (ex. kind) ou du NAS ne declenchent rien.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{cluster="kind", namespace="cyberlab-production", env="production", deployment="sherlock"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: AwsProductionWorkloadDown
        exp_alerts: []

  # Tunnel sans connexion depuis plus de 3 minutes.
  - interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{cluster="aws-k3s", env="production", namespace="cyberlab-production", tunnel="cloudflared-sherlock"}'
        values: "4 4 0x20"
    alert_rule_test:
      - eval_time: 7m
        alertname: AwsTunnelNoConnection
        exp_alerts:
          - exp_labels:
              severity: critical
              service: cyberlab
              cluster: aws-k3s
              env: production
              namespace: cyberlab-production
              tunnel: cloudflared-sherlock
            exp_annotations:
              summary: "AWS : tunnel cloudflared-sherlock sans connexion Cloudflare (production)"
              description: "Le tunnel cloudflared-sherlock n'a plus aucune connexion active vers Cloudflare depuis 3 minutes."

  # Memoire : 90 % de la limite pendant plus de 5 minutes => warning ; limite a 0 (absente) => rien.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{cluster="aws-k3s", env="production", namespace="cyberlab-production", pod="sherlock-x", container="sherlock"}'
        values: "460000000x20"
      - series: 'container_spec_memory_limit_bytes{cluster="aws-k3s", env="production", namespace="cyberlab-production", pod="sherlock-x", container="sherlock"}'
        values: "512000000x20"
      - series: 'container_memory_working_set_bytes{cluster="aws-k3s", env="production", namespace="cyberlab-production", pod="nolimit-x", container="nolimit"}'
        values: "900000000x20"
      - series: 'container_spec_memory_limit_bytes{cluster="aws-k3s", env="production", namespace="cyberlab-production", pod="nolimit-x", container="nolimit"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: AwsContainerHighMemory
        exp_alerts:
          - exp_labels:
              severity: warning
              service: cyberlab
              cluster: aws-k3s
              env: production
              namespace: cyberlab-production
              pod: sherlock-x
              container: sherlock
            exp_annotations:
              summary: "AWS : memoire elevee sur sherlock-x (production)"
              description: "sherlock utilise 89.84% de sa limite memoire (seuil 85 %) depuis 5 minutes."
